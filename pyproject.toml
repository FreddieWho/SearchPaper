[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searchpaper"
dynamic = ["version"]
description = "Literature-first infrastructure layer for agent-assisted research across open scholarly sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "who", email = "freddiewho@163.com" }]
keywords = [
    "literature-search",
    "pubmed",
    "crossref",
    "openalex",
    "semantic-scholar",
    "pubtator3",
    "mcp",
    "agent-tools",
    "scholarly-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mcp>=1.6.0",
    "httpx>=0.27.0",
    "httpx[socks]",
    "pydantic>=2.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
remote = [
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.22",
    "ruff>=0.6",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
searchpaper = "searchpaper.cli:main"

[project.urls]
Homepage = "https://github.com/freddiewho/paperSearch"
Repository = "https://github.com/freddiewho/paperSearch"
Issues = "https://github.com/freddiewho/paperSearch/issues"

[tool.setuptools.dynamic]
version = { attr = "searchpaper.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.setuptools.packages.find]
where = ["src"]
